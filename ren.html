<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Energy Monitoring system | Pro-Aligned v18.0</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        :root {
            /* Light Mode Palette */
            --primary: #6c63ff;
            --accent: #ff4ecd;
            --neon: #00e5ff;
            --bg-canvas: radial-gradient(ellipse at center, #beddf7, #566aff);
            --component-bg: rgba(209, 218, 245, 0.856);
            --glass-border: rgb(130, 202, 240);
            --text-main: #0f172a;
            --text-dim: #475569;
            --danger: #ff4d6d;
            --eco: #00c896;
            --glow-soft: 0 10px 30px rgba(108, 99, 255, 0.1);
            --glow-strong: 0 15px 45px rgba(108, 99, 255, 0.2);
        }

        body.dark-mode {
            /* Dark Mode Palette */
            --bg-canvas: linear-gradient(120deg, #020617, #0f172a);
            --component-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg-canvas); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            transition: background 0.6s ease;
        }

        /* --- Aura Background --- */
        .bg-aura { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .blob {
            position: absolute; width: min(80vw, 850px); height: min(80vw, 850px);
            border-radius: 50%; filter: blur(130px); opacity: 0.45;
            animation: move-blob 25s infinite alternate ease-in-out;
            transition: background 0.8s ease;
        }
        .blob-1 { top: -10%; left: -10%; background: radial-gradient(circle, var(--primary), transparent 70%); }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, var(--neon), transparent 70%); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; background: radial-gradient(circle, var(--accent), transparent 70%); animation-delay: -10s; }

        @keyframes move-blob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(100px, -80px) scale(1.1); }
            100% { transform: translate(-80px, 100px) scale(0.9); }
        }

        /* --- Global UI --- */
        .glass {
            background: var(--component-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), inset 0 1px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .glass:hover { transform: translateY(-3px); box-shadow: var(--glow-strong); }

        .btn-glow-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border-radius: 14px; padding: 12px 24px; cursor: pointer;
            box-shadow: var(--glow-soft); transition: all 0.3s ease; border: none;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-glow-primary:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.2); }

        .eco-active { 
            background: linear-gradient(135deg, #059669, var(--eco)) !important; 
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); 
            color: white !important; 
        }

        .modal-overlay { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(15px); transition: all 0.4s ease; z-index: 6000; }
        body.dark-mode .modal-overlay { background: rgba(0, 0, 0, 0.8); }

        /* --- Analog Clock --- */
        .analog-clock-wrapper { position: relative; width: 260px; height: 260px; margin: 0 auto; cursor: crosshair; user-select: none; }
        .analog-clock-face {
            position: absolute; inset: 0; background: var(--component-bg); backdrop-filter: blur(20px);
            border-radius: 50%; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 45px rgba(0,0,0,0.1), inset 0 0 20px rgba(255,255,255,0.4);
        }
        .clock-number { position: absolute; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 16px; font-weight: 800; color: var(--text-main); transform: translate(-50%, -50%); pointer-events: none; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 10px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
        .hour-hand { width: 8px; height: 55px; background: var(--text-main); z-index: 3; }
        .min-hand { width: 4px; height: 80px; background: var(--primary); z-index: 2; }
        .sec-hand { width: 2px; height: 100px; background: var(--neon); box-shadow: 0 0 10px var(--neon); z-index: 1; }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: var(--primary); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; box-shadow: 0 0 15px var(--primary); }

        .scanner::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(0, 229, 255, 0.08), transparent);
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .min-h-0 { min-height: 0; }
        .flex-lock { height: 100vh; display: flex; flex-direction: column; }

        @media (max-width: 1024px) {
            body { overflow-y: auto; }
            .flex-lock { height: auto; overflow: visible; }
            #main-ui { overflow: visible !important; height: auto !important; max-height: none !important; }
            .viz-container { height: 500px !important; flex: none !important; margin: 1rem 0; }
            .grid { display: flex; flex-direction: column; gap: 1.5rem; }
            aside { width: 100% !important; flex: none !important; }
        }
    </style>
</head>
<body id="app-body">

    <div class="bg-aura">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="toast-container" class="fixed top-8 right-8 z-[9000] flex flex-col gap-4"></div>

    <!-- Modal -->
    <div id="info-modal" class="fixed inset-0 hidden items-center justify-center p-4 modal-overlay" style="opacity: 0">
        <div class="glass p-8 md:p-10 rounded-[3rem] max-w-xl w-full shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                <h2 id="modal-title" class="text-3xl font-bold tracking-tighter truncate uppercase text-indigo-600 dark:text-white">Hardware ID</h2>
                <div class="flex bg-black/5 dark:bg-white/10 p-1 rounded-2xl shrink-0">
                    <button id="tab-info" onclick="window.setModalTab('info')" class="text-[11px] font-bold px-5 py-2.5 rounded-xl bg-indigo-600 text-white uppercase tracking-widest transition-all">Intel</button>
                    <button id="tab-schedule" onclick="window.setModalTab('schedule')" class="text-[11px] font-bold px-5 py-2.5 rounded-xl text-slate-500 uppercase tracking-widest transition-all">Routine</button>
                </div>
            </div>
            
            <div id="modal-content-info" class="mb-6">
                <p id="modal-desc" class="text-dim leading-relaxed font-bold text-base mb-6">Synchronizing grid telemetry...</p>
                <div class="p-6 bg-black/5 dark:bg-black/20 rounded-3xl border border-white/20 space-y-4 font-mono text-[13px]">
                    <div class="flex justify-between border-b border-black/5 pb-2">
                        <span class="text-dim uppercase font-black">Integrity</span>
                        <span id="diag-state" class="font-bold text-emerald-500">EXCELLENT</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-dim uppercase font-black">Runtime</span>
                        <span id="diag-runtime" class="font-bold text-indigo-500">0.0h</span>
                    </div>
                </div>
            </div>

            <div id="modal-content-schedule" class="mb-6 hidden">
                <div class="flex flex-col items-center gap-6">
                    <div class="flex gap-3 w-full">
                        <button id="clock-mode-start" onclick="window.setClockEditMode('start')" class="flex-1 py-4 rounded-2xl text-[11px] font-bold transition-all border border-indigo-200 bg-indigo-600 text-white uppercase tracking-widest text-center shadow-lg">Establish</button>
                        <button id="clock-mode-stop" onclick="window.setClockEditMode('stop')" class="flex-1 py-4 rounded-2xl text-[11px] font-bold transition-all border border-indigo-200 bg-black/5 text-slate-500 uppercase tracking-widest text-center">Sever</button>
                    </div>

                    <div class="analog-clock-wrapper" id="analog-picker">
                        <div class="analog-clock-face" id="clock-face">
                            <div class="clock-center"></div>
                            <div id="hand-h" class="hand hour-hand"></div>
                            <div id="hand-m" class="hand min-hand"></div>
                            <div id="hand-s" class="hand sec-hand"></div>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button id="unit-h" onclick="window.setActiveUnit('h')" class="unit-toggle-btn glass !px-4 !py-1 text-xs">Hrs</button>
                        <button id="unit-m" onclick="window.setActiveUnit('m')" class="unit-toggle-btn glass !px-4 !py-1 text-xs">Min</button>
                        <button id="unit-s" onclick="window.setActiveUnit('s')" class="unit-toggle-btn glass !px-4 !py-1 text-xs">Sec</button>
                    </div>

                    <div class="flex items-center justify-center gap-5">
                        <div class="clock-segment glass p-4 text-center w-20"><div id="picker-h" class="clock-val text-2xl">00</div></div>
                        <span class="text-3xl font-black opacity-30">:</span>
                        <div class="clock-segment glass p-4 text-center w-20"><div id="picker-m" class="clock-val text-2xl">00</div></div>
                        <span class="text-3xl font-black opacity-30">:</span>
                        <div class="clock-segment glass p-4 text-center w-20"><div id="picker-s" class="clock-val text-2xl">00</div></div>
                    </div>

                    <div class="flex w-full gap-4 pt-2">
                        <button onclick="window.applySchedule()" class="flex-1 btn-glow-primary py-5 rounded-2xl font-black text-sm tracking-widest uppercase">Commit Routine</button>
                        <button onclick="window.clearSchedule()" class="bg-black/5 px-8 py-5 rounded-2xl font-bold uppercase text-slate-500">Reset</button>
                    </div>
                </div>
            </div>

            <button onclick="window.closeInfoModal()" class="w-full bg-black/5 py-5 rounded-2xl font-black text-dim uppercase text-[11px] tracking-[0.3em] hover:bg-black/10 mt-4 text-center">Dismiss Hub</button>
        </div>
    </div>

    <!-- Login Layer -->
    <div id="auth-layer" class="fixed inset-0 z-[8000] flex items-center justify-center p-4 transition-all duration-1000">
        <div class="glass p-12 md:p-14 rounded-[4rem] w-full max-w-md text-center border-t-4 border-indigo-500 relative overflow-hidden shadow-2xl">
            <div class="absolute -top-20 -left-20 w-40 h-40 bg-indigo-500/10 blur-[80px]"></div>
            
            <!-- Logo Section -->
            <div class="flex justify-center mb-8">
                <div class="relative w-24 h-24">
                    <div class="absolute inset-0 bg-indigo-500/20 blur-2xl rounded-full animate-pulse"></div>
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_0_15px_rgba(108,99,255,0.5)]">
                        <defs>
                            <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:var(--primary);stop-opacity:1" />
                                <stop offset="100%" style="stop-color:var(--accent);stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" class="text-indigo-500/20" />
                        <path d="M55 10 L30 55 H50 L45 90 L70 45 H50 L55 10 Z" fill="url(#boltGrad)" />
                        <path d="M50 5 L50 15 M95 50 L85 50 M50 95 L50 85 M5 50 L15 50" stroke="var(--neon)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
                    </svg>
                </div>
            </div>

            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase text-slate-800">Nexus OS</h1>
            <p class="text-dim mb-10 font-bold text-xs uppercase tracking-widest text-center">Secure Verification Required</p>
            <div class="space-y-6">
                <input id="key-input" type="password" placeholder="ACCESS KEY" value="admin123" class="w-full bg-black/5 border border-black/10 rounded-2xl px-8 py-5 outline-none focus:border-indigo-500 transition-all text-center font-mono tracking-[0.5em] text-lg font-black text-slate-700">
                <button onclick="window.authorize()" class="w-full btn-glow-primary py-5 rounded-2xl font-black text-sm tracking-widest text-center uppercase">Initialize Command</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main id="main-ui" class="hidden opacity-0 transition-all duration-1000 flex-lock p-4 md:p-6 lg:p-8">
        
        <nav class="flex flex-col md:flex-row justify-between items-center glass px-10 py-4 rounded-[2.5rem] gap-5 shrink-0 mb-6">
            <div class="flex items-center gap-6 w-full md:w-auto">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shrink-0 shadow-xl text-white">
                    <i data-lucide="activity" class="w-7 h-7"></i>
                </div>
                <div>
                    <h2 class="text-lg md:text-xl font-black tracking-tighter uppercase text-nowrap">Energy Monitoring system</h2>
                    <p class="text-[10px] text-indigo-500 font-black tracking-[0.4em]" id="current-clock">--:--:--</p>
                </div>
            </div>
            
            <div class="flex items-center justify-between md:justify-end gap-5 w-full md:w-auto">
                <button onclick="window.toggleDarkMode()" class="p-3.5 glass hover:bg-black/5 transition-all text-dim flex items-center justify-center shadow-lg"><i id="theme-icon" data-lucide="moon" class="w-6 h-6"></i></button>
                <button id="btn-eco" onclick="window.toggleEcoMode()" class="px-8 py-3.5 glass border-2 border-transparent text-[11px] font-black text-dim hover:text-emerald-500 flex items-center gap-3 transition-all uppercase tracking-widest">
                    <i data-lucide="leaf" class="w-5 h-5"></i> ECO-SAVER
                </button>
                <div class="flex items-center gap-4">
                    <button onclick="window.exportCSV()" class="p-4 glass hover:bg-indigo-600 hover:text-white transition-all text-dim flex items-center justify-center"><i data-lucide="database" class="w-6 h-6"></i></button>
                    <button onclick="window.location.reload()" class="p-4 glass hover:bg-rose-600 hover:text-white transition-all text-dim flex items-center justify-center"><i data-lucide="power" class="w-6 h-6"></i></button>
                </div>
            </div>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 overflow-hidden min-h-0">
            <!-- Sidebar Left -->
            <aside class="lg:col-span-3 flex flex-col gap-6 min-h-0 overflow-hidden">
                <div class="glass p-6 md:p-8 rounded-[3.5rem] flex-1 flex flex-col min-h-0 overflow-hidden">
                    <h3 class="text-[11px] font-black text-indigo-600 dark:text-indigo-400 uppercase tracking-[0.5em] mb-6 flex items-center justify-between shrink-0">
                        <span>Switchboard <i data-lucide="info" class="w-4 h-4 inline-block ml-2 cursor-pointer opacity-50 hover:opacity-100" onclick="window.showInfoModal()"></i></span>
                        <button onclick="window.resetAll()" class="text-[9px] text-rose-500 font-bold hover:underline uppercase">Flush</button>
                    </h3>
                    <div id="device-list" class="space-y-4 overflow-y-auto flex-1 pr-2"></div>
                </div>
                <div class="glass p-6 md:p-8 rounded-[2.5rem] shrink-0">
                    <h4 class="text-[11px] font-black text-dim uppercase mb-4 tracking-widest shrink-0 text-center md:text-left">Node Integrity</h4>
                    <div class="flex items-center gap-5">
                        <div class="flex-1 bg-black/5 dark:bg-white/10 h-3 rounded-full overflow-hidden">
                            <div id="health-bar" class="h-full bg-indigo-500 transition-all duration-1000 shadow-[0_0_15px_rgba(99,102,241,0.5)]" style="width: 100%"></div>
                        </div>
                        <span id="health-pct" class="text-sm font-mono font-black text-dim shrink-0">100%</span>
                    </div>
                </div>
            </aside>

            <!-- 3D Visualization -->
            <section class="lg:col-span-6 relative flex flex-col min-h-0 overflow-hidden viz-container">
                <div id="viz-card" class="rounded-[4rem] overflow-hidden relative flex-1 scanner border-2 border-black/5 bg-black/5">
                    <div id="three-container" class="absolute inset-0"></div>
                    <div class="absolute bottom-8 left-8 right-8 flex gap-5 pointer-events-none">
                        <div class="glass px-8 py-5 rounded-[2.5rem] border-l-[12px] border-indigo-500 flex-1 shadow-2xl backdrop-blur-3xl">
                            <p class="text-[10px] text-dim uppercase font-black tracking-widest mb-1">Grid Draw</p>
                            <p id="hud-load" class="text-2xl lg:text-4xl font-black font-mono tracking-tighter">0.00kW</p>
                        </div>
                        <div class="glass px-8 py-5 rounded-[2.5rem] border-l-[12px] border-emerald-500 flex-1 shadow-2xl backdrop-blur-3xl">
                            <p class="text-[10px] text-dim uppercase font-black tracking-widest mb-1">Session Cost</p>
                            <p id="hud-cost" class="text-2xl lg:text-4xl font-black font-mono tracking-tighter">₹0.00</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sidebar Right -->
            <aside class="lg:col-span-3 flex flex-col gap-6 min-h-0 overflow-hidden">
                <div class="glass p-6 rounded-[2.5rem] h-[170px] shrink-0 flex flex-col overflow-hidden">
                    <h3 class="text-[10px] font-black text-dim uppercase tracking-widest mb-3 shrink-0">Telemetry Spectrum</h3>
                    <div class="flex-1 min-h-0"><canvas id="telemetryChart"></canvas></div>
                </div>
                <div class="glass p-6 rounded-[2.5rem] h-[210px] shrink-0 flex flex-col overflow-hidden">
                    <h3 class="text-[10px] font-black text-dim uppercase tracking-widest mb-2 shrink-0 text-center">Usage Balance</h3>
                    <div class="flex-1 min-h-0 flex justify-center"><canvas id="distributionChart"></canvas></div>
                </div>
                <div class="glass p-8 rounded-[3rem] flex-1 flex flex-col min-h-0 border border-white/5 overflow-hidden font-black">
                    <h3 class="text-[11px] font-black text-dim uppercase tracking-widest mb-5 shrink-0">Activity Stream</h3>
                    <div id="log-container" class="flex-1 overflow-y-auto space-y-4 text-[10px] font-mono pr-2 scroll-smooth font-black uppercase"></div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        /**
         * --- 1. CORE UTILS (GLOBAL SCOPE) ---
         */
        window.safeSetText = function(id, text) { const el = document.getElementById(id); if (el) el.innerText = text; };

        window.addLog = function(msg, type) { 
            const c = document.getElementById('log-container'); if (!c) return;
            const div = document.createElement('div');
            const colors = { success: 'text-emerald-500', alert: 'text-rose-500', error: 'text-rose-600', info: 'text-indigo-500' };
            div.className = `${colors[type] || 'text-dim'} border-l-4 border-current pl-4 py-2 bg-black/5 dark:bg-white/5 rounded-r-2xl shadow-sm mb-3`;
            div.innerHTML = `<span class="opacity-50 text-[8px] block font-black mb-1">${new Date().toLocaleTimeString()}</span>${msg}`;
            c.prepend(div);
        };

        window.showToast = function(msg, type) { 
            const container = document.getElementById('toast-container'); if (!container) return;
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-indigo-600' };
            toast.className = `${colors[type]} px-10 py-5 rounded-[1.5rem] text-white font-black text-[12px] shadow-2xl transition-all duration-300 transform scale-0 flex items-center gap-4`;
            toast.innerHTML = `<i data-lucide="zap" class="w-6 h-6"></i> ${msg.toUpperCase()}`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.remove('scale-0'), 10);
            setTimeout(() => { toast.classList.add('scale-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        };

        class ConsumptionProfile {
            constructor(base, varnce, phases = []) {
                this.base = base; this.varnce = varnce; this.phases = phases;
                this.currentPhaseIndex = 0; this.phaseTimer = 0;
            }
            getLoad() {
                let multi = 1;
                if(this.phases && this.phases.length > 0) {
                    const p = this.phases[this.currentPhaseIndex]; multi = p.multi;
                    this.phaseTimer++;
                    if(this.phaseTimer >= p.duration) { this.phaseTimer = 0; this.currentPhaseIndex = (this.currentPhaseIndex + 1) % this.phases.length; }
                }
                return (this.base + (Math.random() - 0.5) * this.varnce) * multi;
            }
        }

        let telChart, distChart;
        let devices = [];
        const state = {
            totalLoad: 0, ecoMode: false, currentModalDevice: null, history: Array(25).fill(0),
            three: { scene: null, camera: null, renderer: null, nodes: [], particles: [], core: null, paths: [], handshakeLines: [], ambientLight: null },
            analytics: [], clockEditMode: 'start', activeUnit: 'h',
            tempSchedule: { start: { h:0, m:0, s:0 }, stop: { h:0, m:0, s:0 } }
        };

        const deviceDefinitions = [
            { id: 0, type: 'fridge', name: "Smart Refrigerator", base: 1.2, var: 0.15, color: '#6c63ff', phases: [{duration: 40, multi: 1, name: 'Idle'}, {duration: 20, multi: 1.8, name: 'Cooling'}] },
            { id: 1, type: 'washing', name: "Industrial Washer", base: 4.8, var: 1.5, color: '#a855f7', phases: [{duration: 15, multi: 0.2, name: 'Fill'}, {duration: 30, multi: 1.5, name: 'Heat'}, {duration: 20, multi: 1.2, name: 'Spin'}] },
            { id: 2, type: 'tv', name: "Cinema OLED Hub", base: 0.6, var: 0.05, color: '#ff4ecd', phases: [] },
            { id: 3, type: 'fan', name: "Climate Control Fan", base: 0.4, var: 0.1, color: '#00c896', phases: [] },
            { id: 4, type: 'oven', name: "Precision Oven", base: 3.5, var: 0.4, color: '#f59e0b', phases: [{duration: 45, multi: 1, name: 'Bake'}] }
        ];

        /**
         * --- 3. THEME ENGINE ---
         */
        window.toggleDarkMode = function() {
            const isDark = document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
            
            if(state.three.ambientLight) state.three.ambientLight.intensity = isDark ? 0.6 : 1.0;
            
            const chartColor = getComputedStyle(document.body).getPropertyValue('--text-dim').trim();
            if(telChart) { telChart.options.scales.y.ticks.color = chartColor; telChart.update(); }
            if(distChart) { distChart.options.plugins.legend.labels.color = chartColor; distChart.update(); }
        };

        /**
         * --- 4. 3D SYSTEM ---
         */
        function createHardware(def) {
            const node = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: def.color, metalness: 0.1, roughness: 0.4 });
            if(def.type === 'fridge') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 5.2, 2.2), mat);
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), new THREE.MeshStandardMaterial({color:0xeeeeee, metalness:1}));
                handle.position.set(1.1, 0, 1.15); node.add(body, handle);
                const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 64;
                const texture = new THREE.CanvasTexture(canvas);
                const label = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.6), new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0 }));
                label.position.set(0, 1.2, 1.11); node.add(label);
                node.userData = { label, texture, context: canvas.getContext('2d'), type: 'fridge' };
            } else if(def.type === 'washing') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.2, 3), mat);
                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.1, 16, 64), new THREE.MeshStandardMaterial({color:0x94a3b8, metalness:1}));
                rim.position.z = 1.51; 
                const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.5, 32), new THREE.MeshStandardMaterial({color:0xdddddd}));
                drum.rotation.x = Math.PI/2; drum.position.z = 0.5; node.add(body, rim, drum);
                node.userData = { drum, type: 'washing' };
            } else if(def.type === 'tv') {
                const screen = new THREE.Mesh(new THREE.BoxGeometry(5.4, 3.4, 0.25), mat);
                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
                const texture = new THREE.CanvasTexture(canvas);
                const screenPlane = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 3.2), new THREE.MeshBasicMaterial({ map: texture, color: 0xffffff }));
                screenPlane.position.z = 0.13; node.add(screen, screenPlane);
                const bubbles = []; for(let j=0; j<6; j++) bubbles.push({ x: Math.random()*256, y: Math.random()*128, r: 15, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, hue: Math.random()*360 });
                node.userData = { texture, context: canvas.getContext('2d'), bubbles, type: 'tv' };
            } else if(def.type === 'fan') {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4.5), mat);
                const blades = new THREE.Group();
                for(let j=0; j<3; j++) {
                    const b = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.05, 0.5), new THREE.MeshStandardMaterial({color: 0xffffff}));
                    b.rotation.y = (j * Math.PI * 2) / 3; blades.add(b);
                }
                blades.position.y = 2.2; blades.rotation.x = Math.PI/2;
                const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0 }));
                ring.position.y = 2.8; ring.rotation.x = Math.PI/2;
                node.add(pole, blades, ring);
                node.userData = { blades, holoRing: ring, type: 'fan' };
            } else {
                const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.8, 3), mat);
                const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.4), new THREE.MeshPhysicalMaterial({color:0x000000, transparent:true, opacity:0.6}));
                glass.position.z = 1.51;
                const glow = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.2, 2.4), new THREE.MeshBasicMaterial({color: 0xff4400, transparent:true, opacity:0}));
                node.add(body, glass, glow);
                node.userData = { glow, type: 'oven' };
            }
            return node;
        }

        function init3D() {
            const c = document.getElementById('three-container'); if(!c) return;
            state.three.scene = new THREE.Scene();
            state.three.camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 0.1, 2000);
            state.three.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            state.three.renderer.setSize(c.clientWidth, c.clientHeight);
            c.appendChild(state.three.renderer.domElement);
            
            state.three.ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            state.three.scene.add(state.three.ambientLight);
            const p1 = new THREE.PointLight(0xffffff, 1.2, 300); p1.position.set(10, 50, 50); state.three.scene.add(p1);
            
            const radius = 48;
            devices.forEach((d, i) => {
                const angle = (i / devices.length) * Math.PI * 2;
                const node = createHardware(d);
                node.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                node.lookAt(0, 50, 200); 
                node.scale.setScalar(4.5); 
                state.three.scene.add(node); state.three.nodes.push(node);
                
                const path = new THREE.QuadraticBezierCurve3(
                    new THREE.Vector3(0,0,0), 
                    new THREE.Vector3(Math.cos(angle)*radius*0.5, 20, Math.sin(angle)*radius*0.5), 
                    node.position.clone()
                );
                state.three.paths.push(path);

                const lineGeo = new THREE.BufferGeometry().setFromPoints(path.getPoints(50));
                const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
                const line = new THREE.Line(lineGeo, lineMat);
                state.three.scene.add(line);
                state.three.handshakeLines.push(line);
                
                for(let p=0; p<40; p++) {
                    const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
                    const photon = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), pMat);
                    state.three.scene.add(photon); 
                    state.three.particles.push({ 
                        mesh: photon, material: pMat, devId: d.id, t: Math.random(), 
                        targetSpeed: 0.002 + Math.random() * 0.003, flowSpeed: 0,
                        offset: new THREE.Vector3((Math.random()-0.5)*1.8, (Math.random()-0.5)*1.8, (Math.random()-0.5)*1.8)
                    });
                }
            });
            
            const core = new THREE.Group(); 
            const corePulse = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 2), new THREE.MeshStandardMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.2 })); 
            const coreInner = new THREE.Mesh(new THREE.SphereGeometry(1.8, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00ffff, emissiveIntensity: 3 }));
            core.add(corePulse, coreInner);
            state.three.scene.add(core); state.three.core = core; state.three.corePulse = corePulse;
            
            updateCamera(); animate3D();
        }

        function updateCamera() {
            const w = window.innerWidth;
            const zDist = w < 768 ? 240 : 180;
            const yDist = w < 768 ? 160 : 120;
            state.three.camera.position.set(0, yDist, zDist);
            state.three.camera.lookAt(0, 0, 0);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            const time = Date.now() * 0.001;
            const loadFactor = state.totalLoad / 10;

            if(state.three.core) { 
                state.three.core.rotation.y += 0.005 + loadFactor * 0.06; 
                state.three.corePulse.scale.setScalar(1 + Math.sin(time * 5) * 0.25);
                state.three.core.scale.setScalar(1.1 + Math.sin(time * 3) * 0.08); 
            }

            devices.forEach((dev, i) => {
                const n = state.three.nodes[i]; const u = n.userData; const animS = state.ecoMode ? 0.6 : 1.2;
                state.three.handshakeLines[i].material.opacity = dev.isConnecting ? 0.8 + Math.sin(time*20)*0.2 : 0;
                if(dev.flashEffect > 0) { n.scale.setScalar(4.5 * (1 + dev.flashEffect * 0.5)); dev.flashEffect -= 0.05; } else { n.scale.setScalar(4.5); }

                if(dev.on) {
                    if(u.type === 'fridge') {
                        u.label.material.opacity = 1; const ctx = u.context; ctx.clearRect(0,0,128,64);
                        ctx.fillStyle = '#00ffff'; ctx.font = 'bold 36px monospace'; ctx.fillText(`${Math.round(dev.internalTemp)}°C`, 20, 45);
                        u.texture.needsUpdate = true; if(dev.internalTemp > 4) dev.internalTemp -= 0.01;
                    } else if(u.type === 'tv') {
                        const ctx = u.context; ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,256,128);
                        u.bubbles.forEach(b => { b.x += b.vx; b.y += b.vy; if(b.x<b.r || b.x>256-b.r) b.vx*=-1; if(b.y<b.r || b.y>128-b.r) b.vy*=-1; ctx.fillStyle = `hsla(${180 + Math.sin(time)*30}, 80%, 50%, 0.8)`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
                        u.texture.needsUpdate = true;
                    } else if(u.type === 'fan') {
                        u.blades.rotation.z += 2.5 * animS; u.holoRing.material.opacity = 0.6 + Math.sin(time*10)*0.2; u.holoRing.rotation.y += 0.05;
                    } else if(u.type === 'washing') {
                        u.drum.rotation.y += 1.5 * animS; n.position.y = Math.sin(time*100)*0.1*animS;
                    } else if(u.type === 'oven') { u.glow.material.opacity = 0.6 + Math.sin(time*5)*0.2; }
                } else {
                    if(u.type === 'fridge') u.label.material.opacity = 0; if(u.type === 'fan') u.holoRing.material.opacity = 0; if(u.type === 'oven') u.glow.material.opacity = 0; n.position.y = 0;
                }
            });

            state.three.particles.forEach(p => {
                const dev = devices[p.devId];
                if(dev && dev.flowReady) { 
                    p.mesh.visible = true; 
                    const target = p.targetSpeed + (dev.currentLoad / 300);
                    p.flowSpeed += (target - p.flowSpeed) * 0.05; 
                    p.t += p.flowSpeed; if(p.t > 1) p.t = 0; 
                    const basePos = state.three.paths[p.devId].getPoint(p.t);
                    p.mesh.position.set(basePos.x + p.offset.x * Math.sin(p.t * Math.PI), basePos.y + p.offset.y * Math.sin(p.t * Math.PI), basePos.z + p.offset.z * Math.cos(p.t * Math.PI));
                    p.mesh.scale.setScalar(0.3 * (1.2 + Math.sin(p.t * Math.PI) * 3));
                    p.material.opacity = 0.4 + Math.sin(p.t * Math.PI) * 0.6;
                } else { if(p.mesh) p.mesh.visible = false; p.flowSpeed = 0; }
            });
            if(state.three.renderer) state.three.renderer.render(state.three.scene, state.three.camera);
        }

        /**
         * --- 5. SYSTEM FUNCTIONS ---
         */
        window.authorize = function() {
            if(document.getElementById('key-input').value === 'admin123') {
                document.getElementById('auth-layer').style.display = 'none';
                const ui = document.getElementById('main-ui'); ui.classList.replace('hidden', 'flex');
                setTimeout(() => { ui.style.opacity = '1'; initAll(); }, 50);
            } else window.showToast("Unauthorized Hub Entry", "error");
        };

        window.toggleDevice = function(id, ts = null) {
            const dev = devices[id]; const targetState = ts !== null ? ts : !dev.on;
            if(targetState && !dev.on) {
                dev.on = true; dev.isConnecting = true; dev.flowReady = false;
                window.addLog(`LINKING >> ${dev.name.toUpperCase()}`, "info");
                setTimeout(() => { dev.isConnecting = false; dev.flowReady = true; dev.flashEffect = 1.0; 
                    window.addLog(`ACTIVE >> ${dev.name.toUpperCase()}`, "success");
                    state.three.particles.filter(p => p.devId === id).forEach(p => { p.t = 0; p.flowSpeed = 0.08; });
                }, 1500);
            } else if(!targetState) { dev.on = false; dev.isConnecting = false; dev.flowReady = false; window.addLog(`STOP >> ${dev.name.toUpperCase()}`, "alert"); }
            renderDevices(); window.saveState();
        };

        window.resetAll = function() { devices.forEach((d,i) => window.toggleDevice(i, false)); };

        window.saveState = function() { localStorage.setItem('energy_monitor_v16', JSON.stringify(devices.map(d => ({ id: d.id, on: d.on, health: d.health, start: d.startTime, stop: d.stopTime, runtime: d.runtime })))); };
        window.loadState = function() {
            const saved = localStorage.getItem('energy_monitor_v16'); const data = saved ? JSON.parse(saved) : [];
            devices = deviceDefinitions.map(def => {
                const s = data.find(x => x.id === def.id) || {};
                return { ...def, on: s.on || false, health: s.health ?? 100, startTime: s.start ?? null, stopTime: s.stop ?? null, runtime: s.runtime ?? 0, currentLoad: 0, internalTemp: 24, isConnecting: false, flowReady: s.on || false, flashEffect: 0.0, engine: new ConsumptionProfile(def.base, def.var, def.phases) };
            });
        };

        /**
         * --- 6. INTERFACE ---
         */
        window.setModalTab = function(tab) { 
            document.getElementById('tab-info')?.classList.toggle('bg-indigo-600', tab === 'info'); 
            document.getElementById('tab-info')?.classList.toggle('text-white', tab === 'info'); 
            document.getElementById('tab-schedule')?.classList.toggle('bg-indigo-600', tab === 'schedule'); 
            document.getElementById('tab-schedule')?.classList.toggle('text-white', tab === 'schedule'); 
            document.getElementById('modal-content-info')?.classList.toggle('hidden', tab !== 'info');
            document.getElementById('modal-content-schedule')?.classList.toggle('hidden', tab !== 'schedule');
        };
        window.closeInfoModal = function() { const m = document.getElementById('info-modal'); if (m) { m.style.opacity = '0'; setTimeout(() => m.style.display = 'none', 300); } };
        window.showInfoModal = function() { const m = document.getElementById('info-modal'); if (m) { window.safeSetText('modal-title', "Node Protocol"); m.style.display = 'flex'; setTimeout(() => m.style.opacity = '1', 10); } window.setModalTab('info'); };
        window.setClockEditMode = function(mode) { 
            state.clockEditMode = mode; 
            document.getElementById('clock-mode-start').className = `flex-1 py-4 rounded-2xl text-[11px] font-bold transition-all border border-indigo-200 dark:border-white/10 ${mode === 'start' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`;
            document.getElementById('clock-mode-stop').className = `flex-1 py-4 rounded-2xl text-[11px] font-bold transition-all border border-indigo-200 dark:border-white/10 ${mode === 'stop' ? 'bg-indigo-600 text-white' : 'bg-black/5'}`;
            updateClockUI(); 
        };
        window.setActiveUnit = function(unit) { state.activeUnit = unit; };
        window.applySchedule = function() {
            const pad = (v) => v.toString().padStart(2, '0'); const d = devices[state.currentModalDevice];
            d.startTime = `${pad(state.tempSchedule.start.h)}:${pad(state.tempSchedule.start.m)}:${pad(state.tempSchedule.start.s)}`;
            d.stopTime = `${pad(state.tempSchedule.stop.h)}:${pad(state.tempSchedule.stop.m)}:${pad(state.tempSchedule.stop.s)}`;
            window.addLog(`SYNC >> ${d.name} ROUTINE AT ${d.startTime}`, "info"); window.closeInfoModal(); renderDevices(); window.saveState();
        };
        window.clearSchedule = function() { state.tempSchedule = { start: { h:0, m:0, s:0 }, stop: { h:0, m:0, s:0 } }; updateClockUI(); };
        window.toggleEcoMode = function() { state.ecoMode = !state.ecoMode; document.getElementById('btn-eco')?.classList.toggle('eco-active'); const tCol = state.ecoMode ? 0x00ff88 : 0x00ffff; state.three.particles.forEach(p => p.material.color.setHex(tCol)); };
        window.exportCSV = function() { let csv = "Timestamp,TotalLoad_kW\n"; state.analytics.forEach(r => { csv += `${r.time},${r.load}\n`; }); const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'energy_data.csv'; a.click(); };

        function renderDevices() {
            const container = document.getElementById('device-list'); if (!container) return;
            container.innerHTML = devices.map(d => `
                <div class="glass p-5 flex items-center justify-between border border-black/5 dark:border-white/10 hover:border-indigo-500/50 transition-all gap-4">
                    <div class="flex items-center gap-4 min-w-0 flex-1">
                        <div class="w-2 h-12 rounded-full shrink-0 shadow-lg" style="background: ${d.color}"></div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-black uppercase tracking-tighter truncate">${d.name}</p>
                            <p class="text-[9px] text-dim font-black uppercase">${d.type === 'fridge' && d.on ? `TEMP: ${Math.round(d.internalTemp)}°C` : `HEALTH: ${Math.round(d.health)}%`}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <i data-lucide="clock" class="w-5 h-5 text-dim cursor-pointer hover:text-indigo-500" onclick="window.openSchedule(${d.id})"></i>
                        <span id="load-val-${d.id}" class="text-[12px] font-mono font-black w-14 text-right text-indigo-500">--</span>
                        <button onclick="window.toggleDevice(${d.id})" class="w-12 h-6 bg-black/10 dark:bg-white/10 rounded-full relative border border-black/5 shrink-0 overflow-hidden">
                            <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all duration-300 transform ${d.on ? 'translate-x-6 !bg-indigo-600' : 'bg-slate-400'}"></div>
                        </button>
                    </div>
                </div>
            `).join(''); lucide.createIcons();
        }

        window.openSchedule = function(id) { state.currentModalDevice = id; const d = devices[id]; const m = document.getElementById('info-modal'); if (m) { window.safeSetText('modal-title', d.name); window.safeSetText('diag-runtime', d.runtime.toFixed(1)+'h'); m.style.display = 'flex'; setTimeout(() => m.style.opacity = '1', 10); } window.setClockEditMode('start'); window.setModalTab('info'); };

        function initClockFace() {
            const face = document.getElementById('clock-face');
            for(let i=1; i<=12; i++) {
                const num = document.createElement('div'); num.className = 'clock-number'; num.innerText = i;
                const angle = (i * 30) * (Math.PI / 180);
                num.style.left = `calc(50% + ${85 * Math.sin(angle)}px)`; num.style.top = `calc(50% - ${85 * Math.cos(angle)}px)`;
                face.appendChild(num);
            }
            document.getElementById('analog-picker').addEventListener('mousedown', handleClockInput);
        }

        function handleClockInput(e) {
            const wrapper = document.getElementById('analog-picker'); const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - (rect.left + rect.width / 2); const mouseY = e.clientY - (rect.top + rect.height / 2);
            let angle = Math.atan2(mouseY, mouseX) * (180 / Math.PI) + 90; if (angle < 0) angle += 360;
            let target = state.tempSchedule[state.clockEditMode];
            if(state.activeUnit === 'h') { target.h = Math.round(angle / 30) % 12; if (target.h === 0) target.h = 12; }
            else { let val = Math.round(angle / 6) % 60; if(state.activeUnit === 'm') target.m = val; else target.s = val; }
            updateClockUI();
        }

        function updateClockUI() {
            const pad = (v) => v.toString().padStart(2, '0'); const current = state.tempSchedule[state.clockEditMode];
            window.safeSetText('picker-h', pad(current.h)); window.safeSetText('picker-m', pad(current.m)); window.safeSetText('picker-s', pad(current.s));
            document.getElementById('hand-h').style.transform = `translateX(-50%) rotate(${(current.h % 12) * 30 + current.m * 0.5}deg)`;
            document.getElementById('hand-m').style.transform = `translateX(-50%) rotate(${current.m * 6}deg)`;
            document.getElementById('hand-s').style.transform = `translateX(-50%) rotate(${current.s * 6}deg)`;
        }

        function initCharts() {
            const ctx1 = document.getElementById('telemetryChart')?.getContext('2d'); const ctx2 = document.getElementById('distributionChart')?.getContext('2d');
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-dim').trim();
            telChart = new Chart(ctx1, { type: 'line', data: { labels: Array(25).fill(''), datasets: [{ data: state.history, borderColor: '#6c63ff', borderWidth: 3, fill: true, backgroundColor: 'rgba(108, 99, 255, 0.05)', tension: 0.5, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { color: textColor, font: { size: 10, weight: 'bold' } } } } } });
            distChart = new Chart(ctx2, { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { legend: { display: true, position: 'bottom', labels: { color: textColor, font: { size: 10, weight: 'bold' }, boxWidth: 10 } } } } });
        }

        function startLoop() {
            setInterval(() => {
                const now = new Date(); const clockStr = now.toLocaleTimeString([], { hour12: false });
                window.safeSetText('current-clock', clockStr);
                let total = 0, healthSum = 0;
                devices.forEach(d => {
                    if(d.startTime === clockStr && !d.on) window.toggleDevice(d.id, true);
                    if(d.stopTime === clockStr && d.on) window.toggleDevice(d.id, false);
                    if(d.on && d.flowReady) {
                        let load = d.engine.getLoad(); if(state.ecoMode) load *= 0.65;
                        d.currentLoad = load; total += load; d.health -= 0.001; d.runtime += 1/3600;
                        window.safeSetText(`load-val-${d.id}`, load.toFixed(2) + "kW");
                    } else window.safeSetText(`load-val-${d.id}`, d.isConnecting ? "LINK" : "OFF");
                    healthSum += d.health;
                });
                state.totalLoad = total; state.history.push(total); state.history.shift();
                window.safeSetText('hud-load', total.toFixed(2) + "kW"); window.safeSetText('hud-cost', "₹" + (total * 8.5 / 24).toFixed(2));
                window.safeSetText('health-pct', Math.max(0, Math.round(healthSum/devices.length)) + "%");
                const hB = document.getElementById('health-bar'); if (hB) hB.style.width = Math.max(0, healthSum/devices.length) + "%";
                if(distChart) {
                    const active = devices.filter(d => d.on && d.flowReady);
                    distChart.data.labels = active.map(d => d.name);
                    distChart.data.datasets[0].data = active.map(d => d.currentLoad);
                    distChart.data.datasets[0].backgroundColor = active.map(d => d.color);
                    distChart.update('none');
                }
                if(telChart) { telChart.data.datasets[0].data = state.history; telChart.update('none'); }
            }, 1000);
        }

        function initAll() { window.loadState(); lucide.createIcons(); init3D(); initCharts(); renderDevices(); startLoop(); initClockFace(); window.addLog("Hub Synchronized.", "success"); }
        window.onresize = () => { const c = document.getElementById('three-container'); if(state.three.camera && state.three.renderer && c) { state.three.camera.aspect = c.clientWidth / c.clientHeight; state.three.camera.updateProjectionMatrix(); state.three.renderer.setSize(c.clientWidth, c.clientHeight); updateCamera(); } };
    </script>
</body>
