<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Nexus Prime | IoT Infrastructure v34.1</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --neon: #22d3ee;
            --bg-canvas: #020617;
            --component-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ff4d6d;
            --eco: #00ff00;
        }

        body.light-mode {
            --bg-canvas: #f1f5f9;
            --component-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(99, 102, 241, 0.15);
            --text-main: #1e293b;
            --text-dim: #64748b;
        }

        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg-canvas); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-aura { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .blob {
            position: absolute; width: min(80vw, 850px); height: min(80vw, 850px);
            border-radius: 50%; filter: blur(130px); opacity: 0.25;
            animation: move-blob 25s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; background: radial-gradient(circle, var(--primary), transparent 70%); }
        .blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, var(--neon), transparent 70%); animation-delay: -5s; }

        @keyframes move-blob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-80px, 120px) scale(0.9); }
        }

        /* --- Splash Screen --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 20000;
            background: #020617;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-in-out, transform 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .splash-core {
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, #fff, var(--primary));
            box-shadow: 0 0 80px var(--primary);
            animation: splash-pulse 2s infinite ease-in-out;
            margin-bottom: 2rem;
        }
        @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
        
        /* --- Visual Transitions --- */
        .fade-slide-up { animation: fadeSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .glass {
            background: var(--component-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* 2D Grid Visualizer */
        #radial-stage { 
            position: relative; 
            width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center;
            overflow: visible;
        }
        .power-line { fill: none; stroke: #1e293b; stroke-width: 4; stroke-linecap: round; transition: stroke 0.5s ease; opacity: 0.3; }
        .power-line.active { stroke: var(--neon); stroke-width: 5; opacity: 1; }
        .power-line.eco { stroke: var(--eco) !important; }
        .particle { fill: var(--neon); filter: drop-shadow(0 0 8px var(--neon)); }

        .device-node { position: absolute; transform: translate(-50%, -50%); width: 130px; z-index: 50; }
        .core-orb {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #fff, var(--primary));
            border-radius: 50%; box-shadow: 0 0 50px var(--primary);
            animation: core-pulse 3s infinite ease-in-out;
        }
        @keyframes core-pulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.1); filter: brightness(1.3); } }

        .node-icon-bg {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--glass-border);
            border-radius: 20px; padding: 12px;
            display: flex; align-items: center; justify-content: center; flex-direction: column; width: 100%;
        }
        .active-glow { box-shadow: 0 0 30px var(--primary); border-color: var(--primary); }

        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .rotating { animation: rotate-slow 2s linear infinite; }
        .fan-rotating { animation: rotate-slow 0.5s linear infinite; }

        /* Master Grid Layout */
        .dashboard-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
        .master-grid { display: grid; grid-template-columns: 24% 52% 24%; gap: 1rem; flex: 1; min-height: 0; padding: 0 1rem 1rem 1rem; }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border-radius: 14px; padding: 10px 24px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.2); border: none;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-glow:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.1); }

        .eco-active { background: linear-gradient(135deg, #059669, #00ff00) !important; color: white !important; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body id="app-body">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-core"></div>
        <h1 class="text-3xl font-black tracking-[0.4em] uppercase text-white animate-pulse">Energy Monitoring System</h1>
        <p class="text-indigo-400 font-mono text-xs mt-4 tracking-widest uppercase opacity-60">Initializing Neural Grid...</p>
        <div class="w-48 h-1 bg-white/10 rounded-full mt-12 overflow-hidden">
            <div id="splash-loader" class="h-full bg-indigo-500 transition-all duration-1000" style="width: 0%"></div>
        </div>
    </div>

    <div class="bg-aura">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3"></div>

    <!-- 2. LOGIN LAYER -->
    <div id="auth-layer" class="fixed inset-0 z-[10000] hidden items-center justify-center p-4 transition-all duration-1000 bg-black/40 backdrop-blur-xl opacity-0">
        <div class="glass p-16 rounded-[4rem] w-full max-w-lg text-center relative overflow-hidden shadow-2xl border-t-8 border-indigo-500 fade-slide-up">
            <div class="absolute -top-40 -left-40 w-80 h-80 bg-indigo-500/10 blur-[120px]"></div>
            <div class="flex justify-center mb-10">
                <div class="relative w-24 h-24">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_0_20px_rgba(108,99,255,0.6)]">
                        <defs><linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--primary);stop-opacity:1" /><stop offset="100%" style="stop-color:var(--neon);stop-opacity:1" /></linearGradient></defs>
                        <path d="M55 10 L30 55 H50 L45 90 L70 45 H50 L55 10 Z" fill="url(#primeGrad)" />
                    </svg>
                </div>
            </div>
            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Nexus Prime</h1>
            <p class="text-dim mb-10 font-bold text-xs uppercase tracking-[0.4em]">Infrastructure Access Protocol</p>
            <div class="space-y-6">
                <div class="relative group">
                    <input id="key-input" type="password" placeholder="PROTOCOL KEY" value="admin123" class="w-full bg-slate-900/50 border-2 border-slate-700 rounded-2xl px-8 py-5 outline-none focus:border-indigo-500 transition-all text-center font-mono tracking-[0.5em] text-xl font-black text-inherit">
                </div>
                <button onclick="handleAuthorize()" class="w-full btn-glow py-6 rounded-2xl font-black text-lg uppercase tracking-widest">Verify Access</button>
            </div>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD -->
    <div id="main-ui" class="hidden opacity-0 transition-all duration-1000 dashboard-container">
        <nav id="nav-bar" class="flex flex-col md:flex-row justify-between items-center glass px-8 py-3 rounded-[2rem] m-4 gap-4 shrink-0 border-2 border-white/10 translate-y-[-20px] opacity-0 transition-all duration-700">
            <div class="flex items-center gap-6 w-full md:w-auto">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg text-white"><i data-lucide="activity" class="w-5 h-5"></i></div>
                <div><h2 class="text-base font-black tracking-tighter uppercase text-nowrap text-inherit">Infrastructure Monitor</h2><p class="text-[8px] text-indigo-500 font-black tracking-[0.6em]" id="current-clock">--:--:--</p></div>
            </div>
            <div class="flex items-center justify-between md:justify-end gap-5 w-full md:w-auto">
                <button onclick="window.toggleDarkMode()" class="p-2.5 glass hover:bg-black/5 transition-all text-dim flex items-center justify-center shadow-sm"><i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i></button>
                <button id="btn-eco" onclick="window.toggleEcoMode()" class="px-6 py-2.5 glass border-2 border-transparent text-[9px] font-black text-dim hover:text-emerald-500 flex items-center gap-3 transition-all uppercase tracking-widest font-black"><i data-lucide="leaf" class="w-4 h-4"></i> ECO-SAVER</button>
                <div class="flex items-center gap-3">
                    <button onclick="downloadPDF()" class="p-3 glass hover:bg-indigo-600 hover:text-white transition-all text-dim flex items-center justify-center"><i data-lucide="database" class="w-5 h-5"></i></button>
                    <button onclick="location.reload()" class="p-3 glass hover:bg-rose-600 hover:text-white transition-all text-dim flex items-center justify-center"><i data-lucide="power" class="w-5 h-5"></i></button>
                </div>
            </div>
        </nav>

        <div class="master-grid">
            <!-- Sidebar Left -->
            <aside id="side-left" class="flex flex-col gap-4 min-h-0 overflow-hidden translate-x-[-30px] opacity-0 transition-all duration-700 delay-100">
                <div class="glass p-6 rounded-[2.5rem] flex-1 flex flex-col min-h-0 overflow-hidden border-2 border-white/5">
                    <div class="flex items-center justify-between shrink-0 mb-4">
                        <h3 class="text-[9px] font-black text-indigo-600 uppercase tracking-[0.6em]">Switchboard</h3>
                        <button onclick="window.resetAll()" class="text-[8px] text-rose-500 font-black uppercase hover:underline">Flush</button>
                    </div>
                    <!-- Fixed height and scroll to prevent jitter -->
                    <div id="device-list" class="space-y-3 overflow-y-auto flex-1 pr-2"></div>
                </div>
                <div class="glass p-6 rounded-[1.5rem] shrink-0 border-2 border-white/10">
                    <h4 class="text-[9px] font-black text-dim uppercase mb-3 tracking-widest shrink-0">Resilience</h4>
                    <div class="flex items-center gap-3">
                        <div class="flex-1 bg-black/10 dark:bg-white/10 h-2.5 rounded-full overflow-hidden">
                            <div id="health-bar" class="h-full bg-indigo-500 transition-all duration-1000" style="width: 100%"></div>
                        </div>
                        <span id="health-pct" class="text-xs font-mono font-black text-dim">100%</span>
                    </div>
                </div>
            </aside>

            <!-- Radial 2D Visualization -->
            <section id="viz-center" class="relative flex flex-col min-h-0 overflow-hidden viz-container scale-95 opacity-0 transition-all duration-1000 delay-300">
                <div id="viz-card" class="rounded-[3.5rem] overflow-hidden relative flex-1 border-2 border-white/20 bg-slate-900/50 scanner">
                    <div id="radial-stage">
                        <svg id="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40"><div class="core-orb" id="core-orb"></div></div>
                        <div id="nodes-container" class="absolute inset-0 pointer-events-none"></div>
                    </div>

                    <div class="absolute top-6 left-6 pointer-events-none">
                        <div class="glass px-5 py-3 rounded-2xl border-l-[6px] border-indigo-500 shadow-2xl backdrop-blur-3xl min-w-[130px]">
                            <p class="text-[7px] text-dim uppercase font-black mb-0.5 tracking-tighter">Packet Draw</p>
                            <p id="hud-load" class="text-xl font-black font-mono text-indigo-400">0.00kW</p>
                        </div>
                    </div>
                    <div class="absolute top-6 right-6 pointer-events-none">
                        <div class="glass px-5 py-3 rounded-2xl border-l-[6px] border-emerald-500 shadow-2xl backdrop-blur-3xl min-w-[130px]">
                            <p class="text-[7px] text-dim uppercase font-black mb-0.5 tracking-tighter">Utility Cost</p>
                            <p id="hud-cost" class="text-xl font-black font-mono text-emerald-400">₹0.00</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sidebar Right -->
            <aside id="side-right" class="flex flex-col gap-4 min-h-0 overflow-hidden translate-x-[30px] opacity-0 transition-all duration-700 delay-500">
                <div class="glass p-5 flex-1 flex flex-col overflow-hidden border-2 border-white/10 min-h-0">
                    <h3 class="text-[9px] font-black text-dim uppercase tracking-widest mb-2 shrink-0">Telemetry Spectrum</h3>
                    <div class="flex-1 min-h-0"><canvas id="telemetryChart"></canvas></div>
                </div>
                <div class="glass p-5 flex-1 flex flex-col overflow-hidden border-2 border-white/10 min-h-0">
                    <h3 class="text-[9px] font-black text-dim uppercase tracking-widest mb-2 shrink-0 text-center">Radial Balance</h3>
                    <div class="flex-1 min-h-0 flex justify-center"><canvas id="distributionChart"></canvas></div>
                </div>
                <div class="glass p-6 rounded-[2rem] flex-[1.5] flex flex-col min-h-0 overflow-hidden font-black border-2 border-white/10">
                    <h3 class="text-[9px] font-black text-dim uppercase tracking-widest mb-4 shrink-0 text-indigo-500">Traffic stream</h3>
                    <div id="log-container" class="flex-1 overflow-y-auto space-y-3 text-[10px] font-mono pr-2 scroll-smooth uppercase font-black"></div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        /** --- INITIALIZATION & UTILITIES --- **/
        window.safeSetText = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };
        
        window.addLog = (msg, type) => { 
            const c = document.getElementById('log-container'); if (!c) return;
            const div = document.createElement('div');
            const colors = { success: 'text-emerald-500', alert: 'text-rose-500', error: 'text-rose-600', info: 'text-indigo-500' };
            div.className = `${colors[type] || 'text-dim'} border-l-4 border-current pl-4 py-2 bg-black/5 dark:bg-white/5 rounded-r-xl shadow-sm mb-2 transition-all hover:translate-x-1 fade-slide-up`;
            div.innerHTML = `<span class="opacity-50 text-[8px] block font-black mb-1">${new Date().toLocaleTimeString()}</span>${msg}`;
            c.prepend(div);
        };

        window.showToast = (msg, type) => { 
            const container = document.getElementById('toast-container'); if (!container) return;
            const toast = document.createElement('div');
            const colors = { info: 'bg-indigo-600', error: 'bg-rose-600', success: 'bg-emerald-600' };
            toast.className = `${colors[type]} text-white px-8 py-4 rounded-2xl font-black text-xs shadow-2xl transition-all duration-300 transform scale-0 flex items-center gap-4`;
            toast.innerHTML = `<i data-lucide="zap" class="w-5 h-5"></i> ${msg.toUpperCase()}`;
            container.appendChild(toast); lucide.createIcons();
            setTimeout(() => toast.classList.remove('scale-0'), 10);
            setTimeout(() => { toast.classList.add('scale-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        };

        class ConsumptionProfile {
            constructor(base, varc) { this.base = base; this.varc = varc; }
            getLoad() { return (this.base + (Math.random() - 0.5) * this.varc); }
        }

        const deviceDefinitions = [
            { id: 0, type: 'fridge', name: "Neural Chiller", base: 1.2, varc: 0.15, color: '#6366f1', icon: 'refrigerator' },
            { id: 1, type: 'washing', name: "Motor IoT84", base: 4.8, varc: 1.5, color: '#a855f7', icon: 'settings' },
            { id: 2, type: 'tv', name: "Control Terminal", base: 0.6, varc: 0.05, color: '#f43f5e', icon: 'monitor' },
            { id: 3, type: 'fan', name: "Stand Fan IoT50", base: 0.4, varc: 0.1, color: '#00c896', icon: 'fan' },
            { id: 4, type: 'led', name: "Smart Led IoT40", base: 0.3, varc: 0.05, color: '#f59e0b', icon: 'lightbulb' }
        ];

        let telChart, distChart;
        let devices = [];
        let particles = [];
        let state = { totalLoad: 0, ecoMode: false, history: Array(25).fill(0) };

        /** --- TRANSITION MANAGEMENT --- **/
        window.onload = () => {
            const loader = document.getElementById('splash-loader');
            setTimeout(() => { if(loader) loader.style.width = '100%'; }, 100);
            
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const auth = document.getElementById('auth-layer');
                splash.style.opacity = '0';
                splash.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    splash.style.display = 'none';
                    auth.classList.replace('hidden', 'flex');
                    setTimeout(() => auth.style.opacity = '1', 50);
                }, 1000);
            }, 3000);
        };

        window.handleAuthorize = () => {
            if(document.getElementById('key-input').value === 'admin123') {
                const auth = document.getElementById('auth-layer');
                const ui = document.getElementById('main-ui');
                auth.style.opacity = '0';
                auth.style.transform = 'translateY(-20px)';
                
                setTimeout(() => {
                    auth.style.display = 'none';
                    ui.classList.replace('hidden', 'flex');
                    setTimeout(() => {
                        ui.style.opacity = '1';
                        // Staggered dashboard entrance
                        document.getElementById('nav-bar').style.transform = 'translateY(0)';
                        document.getElementById('nav-bar').style.opacity = '1';
                        document.getElementById('side-left').style.transform = 'translateX(0)';
                        document.getElementById('side-left').style.opacity = '1';
                        document.getElementById('side-right').style.transform = 'translateX(0)';
                        document.getElementById('side-right').style.opacity = '1';
                        document.getElementById('viz-center').style.transform = 'scale(1)';
                        document.getElementById('viz-center').style.opacity = '1';
                        initDashboard();
                    }, 50);
                }, 800);
            } else window.showToast("Handshake Refused", "error");
        };

        /** --- CORE UI LOGIC --- **/
        window.toggleDarkMode = () => {
            const isDark = document.body.classList.toggle('light-mode');
            document.getElementById('theme-icon')?.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-dim').trim();
            if(telChart) { telChart.options.scales.y.ticks.color = textColor; telChart.update(); }
            if(distChart) { distChart.options.plugins.legend.labels.color = textColor; distChart.update(); }
        };

        window.toggleEcoMode = () => {
            state.ecoMode = !state.ecoMode;
            document.getElementById('btn-eco')?.classList.toggle('eco-active');
            const core = document.getElementById('core-orb');
            if (core) {
                core.style.boxShadow = state.ecoMode ? "0 0 50px #00ff00" : "0 0 50px #6366f1";
                core.style.background = state.ecoMode ? "radial-gradient(circle, #fff, #00ff00)" : "radial-gradient(circle, #fff, #6366f1)";
            }
            window.addLog(state.ecoMode ? "ECO-DRIVE: OPTIMIZED" : "ECO-DRIVE: DEACTIVATED", state.ecoMode ? "success" : "alert");
        };

        window.toggleDevice = (id) => {
            const d = devices[id];
            d.on = !d.on;
            if (d.on) {
                d.negotiating = true; d.flowReady = false;
                window.addLog(`NODE ${id} >> CIRCUIT NEGOTIATING`, "info");
                setTimeout(() => {
                    d.negotiating = false;
                    setTimeout(() => {
                        d.flowReady = true;
                        window.addLog(`NODE ${id} >> LINK ACTIVE`, "success");
                    }, 500);
                }, 500);
            } else {
                d.flowReady = false; d.negotiating = false;
                window.addLog(`NODE ${id} >> CIRCUIT OPEN`, "alert");
            }
            updateNodeVisuals(id);
            // Updating sidebar manually to avoid layout jitter from full innerHTML replace
            const toggleBtn = document.querySelector(`[data-device-toggle="${id}"]`);
            if (toggleBtn) {
                const inner = toggleBtn.querySelector('div');
                if (d.on) {
                    inner.classList.add('translate-x-5', '!bg-indigo-600', 'shadow-[0_0_10px_rgba(99,102,241,0.8)]');
                } else {
                    inner.classList.remove('translate-x-5', '!bg-indigo-600', 'shadow-[0_0_10px_rgba(99,102,241,0.8)]');
                }
            }
        };

        window.resetAll = () => devices.forEach((d, i) => { if(d.on) window.toggleDevice(i); });

        /** --- 2D VISUALIZATION ENGINE --- **/
        function renderRadialNodes() {
            const container = document.getElementById('nodes-container'); if (!container) return;
            container.innerHTML = devices.map((d, i) => {
                const angle = (i * 2 * Math.PI) / devices.length - Math.PI / 2;
                const swRad = 200, baseRad = 380; // Stable radii
                const swPos = { x: 50 + (swRad/10) * Math.cos(angle), y: 50 + (swRad/10) * Math.sin(angle) };
                const devPos = { x: 50 + (baseRad/10) * Math.cos(angle), y: 50 + (baseRad/10) * Math.sin(angle) };
                return `
                    <div class="device-node" id="node-${d.id}" style="left: ${devPos.x}%; top: ${devPos.y}%">
                        <div class="node-icon-bg flex items-center justify-center">
                             <div id="ani-${d.id}" class="transition-all duration-500"><i data-lucide="${d.icon}" class="w-8 h-8 text-white"></i></div>
                             <span class="text-[8px] font-black uppercase opacity-50 tracking-widest text-center mt-1">${d.name}</span>
                        </div>
                    </div>
                    <div class="absolute transition-all cursor-pointer pointer-events-auto" onclick="window.toggleDevice(${d.id})" style="left: ${swPos.x}%; top: ${swPos.y}%; transform: translate(-50%, -50%)">
                        <div id="sw-vis-${d.id}" class="w-8 h-8 bg-slate-800 rounded-lg border-2 border-slate-700 flex items-center justify-center shadow-lg hover:border-indigo-400 transition-colors">
                            <div class="w-1.5 h-4 bg-red-500 rounded-full transition-all" id="sw-indicator-${d.id}"></div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
            setupGridPaths();
        }

        function setupGridPaths() {
            const svg = document.getElementById('grid-svg'); if (!svg) return;
            svg.innerHTML = ''; particles = [];
            devices.forEach((d, i) => {
                const angle = (i * 2 * Math.PI) / devices.length - Math.PI / 2;
                const cX = 500, cY = 500, swR = 200, devR = 380;
                const swPos = { x: cX + swR * Math.cos(angle), y: cY + swR * Math.sin(angle) };
                const devPos = { x: cX + devR * Math.cos(angle), y: cY + devR * Math.sin(angle) };
                
                // Seg A: Core -> Switch
                createPath(svg, cX, cY, swPos.x, swPos.y, `pathA-${d.id}`);
                // Seg B: Switch -> Device (No LED middleman)
                createPath(svg, swPos.x, swPos.y, devPos.x, devPos.y, `pathB-${d.id}`);
                
                for(let p=0; p<4; p++) {
                    particles.push({ id: d.id, seg: 'A', offset: Math.random(), el: createParticle(svg) });
                    particles.push({ id: d.id, seg: 'B', offset: Math.random(), el: createParticle(svg) });
                }
            });
        }

        function createPath(svg, x1, y1, x2, y2, id) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
            path.setAttribute("class", "power-line");
            path.setAttribute("id", id);
            svg.appendChild(path);
        }

        function createParticle(svg) {
            const p = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            p.setAttribute("r", "4"); p.setAttribute("class", "particle");
            p.style.display = 'none'; svg.appendChild(p); return p;
        }

        function updateNodeVisuals(id) {
            const d = devices[id];
            const indicator = document.getElementById(`sw-indicator-${id}`);
            const node = document.getElementById(`node-${id}`)?.querySelector('.node-icon-bg');
            if (indicator) {
                indicator.style.backgroundColor = d.on ? "#00ff00" : "#ff0000";
                indicator.style.boxShadow = d.on ? "0 0 12px #00ff00" : "none";
            }
            if (d.on) node?.classList.add('active-glow'); else node?.classList.remove('active-glow');
        }

        function animate() {
            particles.forEach(p => {
                const d = devices[p.id];
                const active = p.seg === 'A' || (d.on && d.flowReady);
                const path = document.getElementById(`path${p.seg}-${p.id}`);
                
                if (active && path) {
                    p.el.style.display = 'block';
                    let speed = 0.007 + (d.currentLoad || 0) * 0.0012;
                    p.offset += speed; if (p.offset > 1) p.offset = 0;
                    try {
                        const length = path.getTotalLength(), point = path.getPointAtLength(p.offset * length);
                        p.el.setAttribute("cx", point.x); p.el.setAttribute("cy", point.y);
                        let color = state.ecoMode ? "#00ff00" : "#22d3ee";
                        p.el.setAttribute("fill", color);
                        path.classList.add('active');
                        if(state.ecoMode) path.classList.add('eco'); else path.classList.remove('eco');
                    } catch(e) {}
                } else {
                    p.el.style.display = 'none'; 
                    if(path) path.classList.remove('active', 'eco');
                }
            });

            devices.forEach(d => {
                const ani = document.getElementById(`ani-${d.id}`);
                if (d.on && d.flowReady && ani) {
                    if (d.type === 'fan') ani.classList.add('fan-rotating');
                    if (d.type === 'washing') ani.classList.add('rotating');
                    if (d.type === 'led') ani.style.filter = `drop-shadow(0 0 15px ${state.ecoMode ? "#00ff00" : "#f59e0b"})`;
                } else if (ani) {
                    ani.classList.remove('fan-rotating', 'rotating'); ani.style.filter = "none";
                }
            });
            requestAnimationFrame(animate);
        }

        /** --- SYSTEM LOOP --- **/
        function renderDeviceList() {
            const container = document.getElementById('device-list'); if (!container) return;
            
            // To prevent switchboard jittering, we check if innerHTML needs full refresh 
            // or just value updates. For simplicity and stability, we use a single render 
            // and then update specific nodes in intervals.
            if (container.children.length === 0) {
                container.innerHTML = devices.map(d => `
                    <div class="glass p-4 flex items-center justify-between border border-white/10 hover:border-indigo-500/50 transition-all gap-4">
                        <div class="flex items-center gap-4 min-w-0 flex-1">
                            <div class="w-2.5 h-10 rounded-full shrink-0" style="background: ${d.color}; box-shadow: 0 0 10px ${d.color}"></div>
                            <div class="min-w-0">
                                <p class="text-[12px] font-black uppercase truncate">${d.name}</p>
                                <p id="status-text-${d.id}" class="text-[8px] text-dim font-black uppercase">${d.on ? 'SYNCING' : 'OFFLINE'}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <span id="load-val-${d.id}" class="text-[10px] font-mono font-black w-14 text-right text-indigo-500">--</span>
                            <button onclick="window.toggleDevice(${d.id})" data-device-toggle="${d.id}" class="w-10 h-5 bg-black/10 dark:bg-white/10 rounded-full relative overflow-hidden transition-all">
                                <div class="absolute top-1 left-1 w-3 h-3 bg-slate-400 rounded-full transition-all duration-300 transform"></div>
                            </button>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            }

            // Efficiently update values without re-rendering the whole DOM list
            devices.forEach(d => {
                const loadEl = document.getElementById(`load-val-${d.id}`);
                const statusEl = document.getElementById(`status-text-${d.id}`);
                if (loadEl) loadEl.innerText = (d.on && d.flowReady) ? d.currentLoad.toFixed(1)+'kW' : '--';
                if (statusEl) statusEl.innerText = d.on ? (d.flowReady ? 'LINK: OK' : 'SYNCING') : 'OFFLINE';
            });
        }

        function initCharts() {
            const ctx1 = document.getElementById('telemetryChart').getContext('2d'), ctx2 = document.getElementById('distributionChart').getContext('2d');
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-dim').trim();
            telChart = new Chart(ctx1, { type: 'line', data: { labels: Array(25).fill(''), datasets: [{ data: state.history, borderColor: '#6366f1', borderWidth: 4, fill: true, tension: 0.5, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: textColor, font: { size: 9, weight: 'bold' } } } } } });
            distChart = new Chart(ctx2, { type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '82%', plugins: { legend: { position: 'bottom', labels: { color: textColor, font: { size: 10, weight: 'bold' }, boxWidth: 10 } } } } });
        }

        function startSimLoop() {
            setInterval(() => {
                const now = new Date(); window.safeSetText('current-clock', now.toLocaleTimeString());
                let total = 0;
                devices.forEach(d => {
                    if(d.on && d.flowReady) {
                        let load = d.engine.getLoad(); if(state.ecoMode) load *= 0.65;
                        d.currentLoad = load; total += load;
                    } else d.currentLoad = 0;
                });
                state.totalLoad = total; state.history.push(total); state.history.shift();
                window.safeSetText('hud-load', total.toFixed(2) + "kW"); window.safeSetText('hud-cost', "₹" + (total * 8.5 / 24).toFixed(2));
                
                if(distChart) { 
                    const active = devices.filter(d => d.on && d.flowReady); 
                    distChart.data.labels = active.map(x=>x.name); 
                    distChart.data.datasets[0].data = active.map(x=>x.currentLoad); 
                    distChart.data.datasets[0].backgroundColor = active.map(x=>x.color); 
                    distChart.update('none'); 
                }
                if(telChart) { telChart.data.datasets[0].data = state.history; telChart.update('none'); }
                renderDeviceList();
            }, 1000);
        }

        function initDashboard() {
            devices = deviceDefinitions.map(def => ({ ...def, on: false, flowReady: false, negotiating: false, engine: new ConsumptionProfile(def.base, def.varc) }));
            renderRadialNodes(); 
            initCharts(); 
            startSimLoop(); 
            animate();
            window.addLog("Neural Infrastructure Mapping Complete.", "success");
        }

        async function downloadPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.text("Nexus Prime Grid Audit", 20, 20); doc.text(`Timestamp: ${new Date().toLocaleString()}`, 20, 30); doc.text(`Total Load: ${state.totalLoad.toFixed(2)} kW`, 20, 40);
            doc.save("grid-audit.pdf"); window.showToast("Report Exported", "success");
        }

        window.onresize = () => { if(devices.length) renderRadialNodes(); };
    </script>
</body>
</html>
